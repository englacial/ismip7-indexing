# Build the Lambda container image for both architectures and run the handler
# once under the Lambda Runtime Interface Emulator on each (synthetic files,
# local repository: no AWS access). On main, when the repository variable
# LAMBDA_RELEASE_ROLE_ARN is set (infra/github-oidc.yaml), the arm64 image
# that passed is pushed to ECR from the native runner and the function is
# pointed at it. The stack itself stays with infra/deploy.sh.
name: Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.lambda
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - ismip7_helper/**
      - scripts/dev/rie_*
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Dockerfile.lambda
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - ismip7_helper/**
      - scripts/dev/rie_*
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv venv && uv pip install -e ".[dev]"
      - uses: docker/setup-buildx-action@v3
      - name: Prepare the smoke test
        run: uv run python scripts/dev/rie_smoke.py "$RUNNER_TEMP/rie"
      - name: Build and invoke under the emulator
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/dev/rie_run.sh "$RUNNER_TEMP/rie"
      - name: Assume the release role (OIDC)
        if: matrix.arch == 'arm64' && github.ref == 'refs/heads/main' && vars.LAMBDA_RELEASE_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LAMBDA_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.LAMBDA_AWS_REGION || 'us-west-2' }}
      - name: Push the arm64 image and update the function
        if: matrix.arch == 'arm64' && github.ref == 'refs/heads/main' && vars.LAMBDA_RELEASE_ROLE_ARN != ''
        env:
          FUNCTION: ismip7-virtualize
          REGION: ${{ vars.LAMBDA_AWS_REGION || 'us-west-2' }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
          IMAGE="$ECR/$FUNCTION:${GITHUB_SHA}-arm64"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$ECR"
          docker tag ismip7-virtualize:rie "$IMAGE"
          docker push "$IMAGE"
          aws lambda update-function-code --region "$REGION" --function-name "$FUNCTION" \
              --image-uri "$IMAGE" --architectures arm64 >/dev/null
          aws lambda wait function-updated --region "$REGION" --function-name "$FUNCTION"
          echo "function $FUNCTION now runs $IMAGE (arm64)"
