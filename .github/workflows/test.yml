name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check ismip7_helper tests
      - run: uv run ruff format --check ismip7_helper tests
      - run: uv run pytest -q
