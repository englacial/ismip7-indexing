AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ISMIP7 virtualization worker: one Lambda (container image) that virtualizes
  one ISMIP7 store group per invocation into the englacial Icechunk stores on
  source.coop. See docs/lambda.md. Deploy with infra/deploy.sh.

Parameters:
  FunctionName:
    Type: String
    Default: ismip7-virtualize
  ImageUri:
    Type: String
    Default: ""
    Description: >
      Full ECR image URI (with tag or digest) of the image built from
      Dockerfile.lambda. The ECR repository is created by this stack, so the
      first deploy leaves this empty (no function is created, Lambda accepts
      only private-ECR images), deploy.sh pushes the image, and a second
      deploy with the URI creates the function.

  SecretName:
    Type: String
    Default: ismip7/sc_creds
    Description: Secrets Manager secret holding the source.coop sc_creds.json content (set its value out of band).
  MemorySize:
    Type: Number
    Default: 2048
    Description: >-
      MB; Lambda scales vCPUs with it (1769 MB = 1 vCPU, 10240 = 6). Opening the files is
      bound by S3 latency, not CPU (measured 2026-11-05: 6 workers use ~0.75 vCPU), so
      2048 MB with 8 workers runs a 1,980-file group in ~3 min for a quarter of the
      10 GB price; 10240 MB with 24 workers is ~2x faster at ~3x the price.
  Workers:
    Type: Number
    Default: 8
    Description: >-
      Worker processes opening files per invocation (ISMIP7_WORKERS). Each needs ~75 MB
      and spends ~90% of its time waiting on S3; keep workers x 75 MB well under MemorySize.
  Timeout:
    Type: Number
    Default: 900
  ReservedConcurrency:
    Type: Number
    Default: 250  # one slot per group (218), so a region runs in one wave
  ExecutionRoleArn:
    Type: String
    Default: ""
    Description: >-
      ARN of a pre-created execution role (see infra/execution-role.json). When set, the
      stack creates no IAM role and the deployer needs only iam:PassRole on it; when
      empty, the stack creates ${FunctionName}-execution itself.

Conditions:
  CreateRole: !Equals [!Ref ExecutionRoleArn, ""]
  HasImage: !Not [!Equals [!Ref ImageUri, ""]]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref FunctionName
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 5","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":5},"action":{"type":"expire"}}]}'

  WriteCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref SecretName
      Description: source.coop temporary write credentials for englacial/ismip7 (sc_creds.json content, with Expiration). Rotate before they expire.
      SecretString: '{"placeholder": "set with: aws secretsmanager put-secret-value --secret-id ismip7/sc_creds --secret-string file://sc_creds.json"}'

  ExecutionRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      RoleName: !Sub "${FunctionName}-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-write-credentials-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WriteCredentialsSecret
      # Reads of the public source bucket are anonymous; the target bucket is
      # written with the source.coop credentials from the secret, not this role.

  Function:
    Type: AWS::Lambda::Function
    Condition: HasImage
    Properties:
      FunctionName: !Ref FunctionName
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !If [CreateRole, !GetAtt ExecutionRole.Arn, !Ref ExecutionRoleArn]
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      EphemeralStorage: { Size: 2048 }
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          ISMIP7_WRITE_CREDS_SECRET: !Ref SecretName
          ISMIP7_LOG_LEVEL: INFO
          ISMIP7_WORKERS: !Ref Workers

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 30

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  FunctionArn:
    Condition: HasImage
    Value: !GetAtt Function.Arn
  RoleArn:
    Value: !GetAtt ExecutionRole.Arn
  SecretArn:
    Value: !Ref WriteCredentialsSecret
