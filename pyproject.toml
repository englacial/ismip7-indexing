[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ismip7-helper"
version = "0.1.0"
description = "Conventions, indexing and virtualization helpers for the ISMIP7 datasets on source.coop"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Englacial" }]
keywords = ["ismip7", "ice-sheet", "icechunk", "virtualizarr", "xarray", "cf-conventions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
index = [
    "pandas>=2.2",
    "pyarrow>=15",
    "boto3>=1.34",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ismip7-helper[index]",
]

[project.scripts]
ismip7-index = "ismip7_helper.index:main"
ismip7-conventions-report = "ismip7_helper.report:main"

[tool.hatch.build.targets.wheel]
packages = ["ismip7_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that list the public source.coop bucket"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]
